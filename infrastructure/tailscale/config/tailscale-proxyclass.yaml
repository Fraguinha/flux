apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: default-proxy
spec:
  statefulSet:
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  tailscale.com/parent-resource: ts-proxies
      tailscaleContainer:
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
