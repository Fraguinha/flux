apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flux-webhook
  namespace: flux-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    external-dns.kubernetes.io/target: ${PUBLIC_IPS}
    external-dns.kubernetes.io/ttl: "300"
spec:
  ingressClassName: traefik
  rules:
    - host: flux.fraguinha.com
      http:
        paths:
          - path: /hook/
            pathType: Prefix
            backend:
              service:
                name: webhook-receiver
                port:
                  number: 80
  tls:
    - hosts:
        - flux.fraguinha.com
      secretName: flux-webhook-tls
