apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  fraguinha.server: |
    fraguinha.com:53 {
        errors
        cache 30
        forward . 130.185.80.65 78.47.250.232
    }
    www.fraguinha.com:53 {
        errors
        cache 30
        forward . /etc/resolv.conf
    }
