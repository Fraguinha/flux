apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cnpg
  namespace: flux-system
spec:
  interval: 1m
  timeout: 30m
  path: ./infrastructure/cnpg
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cnpg
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
