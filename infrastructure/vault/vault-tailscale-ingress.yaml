apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-tailscale-ingress
  namespace: vault
  annotations:
    tailscale.com/funnel: "false"
spec:
  ingressClassName: tailscale
  rules:
    - host: vault.tail9a2f1c.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault-ui
                port:
                  number: 8200
  tls:
    - hosts:
        - vault.tail9a2f1c.ts.net
