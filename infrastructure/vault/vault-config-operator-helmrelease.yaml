apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-config-operator-helmrelease
  namespace: flux-system
spec:
  install:
    crds: CreateReplace
    remediation:
      retries: 3
    timeout: 30m
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 30m
  chart:
    spec:
      chart: vault-config-operator
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: vault-config-operator
  interval: 1m
  releaseName: vault-config-operator
  storageNamespace: vault
  targetNamespace: vault
  values:
    enableCertManager: true
    enableMonitoring: false
    env:
      - name: VAULT_ADDR
        value: "http://vault.vault.svc.cluster.local:8200"
