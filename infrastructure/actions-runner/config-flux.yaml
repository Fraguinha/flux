apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-actions-runner-config
  namespace: flux-system
spec:
  interval: 1m
  timeout: 30m
  path: ./infrastructure/actions-runner/config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-actions-runner
    - name: infra-onepassword
