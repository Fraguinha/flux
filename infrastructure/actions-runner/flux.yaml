apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-actions-runner
  namespace: flux-system
spec:
  interval: 1m
  timeout: 30m
  path: ./infrastructure/actions-runner
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: actions-runner
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
