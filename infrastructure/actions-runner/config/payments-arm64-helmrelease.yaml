apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: payments-arm64
  namespace: flux-system
spec:
  interval: 1m
  releaseName: payments-arm64
  targetNamespace: actions-runner
  storageNamespace: actions-runner
  serviceAccountName: helm-infrastructure
  install:
    remediation:
      retries: 3
    timeout: 30m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 30m
  chart:
    spec:
      chart: gha-runner-scale-set
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: actions-runner
  values:
    githubConfigUrl: https://github.com/fraguinha/payments
    githubConfigSecret: actions-runner-secrets
    minRunners: 0
    containerMode:
      type: dind
    template:
      spec:
        nodeSelector:
          kubernetes.io/arch: arm64
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - fraguinha
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command: ["/home/runner/run.sh"]
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
