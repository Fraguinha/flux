apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 1m
  releaseName: longhorn
  targetNamespace: longhorn-system
  storageNamespace: longhorn-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
    timeout: 30m
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 30m
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn
  values:
    defaultSettings:
      autoCleanupWhenDeleteBackup: true
      defaultReplicaCount: 2
      replicaAutoBalance: best-effort
      replicaSoftAntiAffinity: true
      removeSnapshotsDuringFilesystemTrim: true
      snapshotMaxCount: 50
      storageOverProvisioningPercentage: 200
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
      reclaimPolicy: Delete
    storageClass:
      reclaimPolicy: Delete
    longhornUI:
      replicas: 1
