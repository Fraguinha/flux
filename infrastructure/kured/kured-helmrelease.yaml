apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: flux-system
spec:
  interval: 1m
  releaseName: kured
  targetNamespace: kured
  install:
    crds: CreateReplace
    remediation:
      retries: 3
    timeout: 10m
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 10m
  chart:
    spec:
      chart: kured
      sourceRef:
        kind: HelmRepository
        name: kured
  values:
    configuration:
      rebootSentinelFile: /var/run/reboot-required
      period: 1h
      rebootDays: [mo, tu, we, th, fr, sa, su]
      startTime: "02:00"
      endTime: "06:00"
      concurrency: 1
