apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crd.yaml
  - controller.yaml
patches:
  - target:
      version: v1
      kind: Namespace
      name: system-upgrade
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: system-upgrade
        labels:
          policy.fraguinha.com/defaults: enabled
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: system-upgrade-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: system-upgrade-controller
      spec:
        template:
          metadata:
            annotations:
              system-upgrade.fraguinha.com/kubectl-image: rancher/kubectl:v1.36.2
