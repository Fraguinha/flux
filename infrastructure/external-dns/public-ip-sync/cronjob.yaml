apiVersion: batch/v1
kind: CronJob
metadata:
  name: public-ip-sync
  namespace: external-dns
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: public-ip-sync
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: sync
              image: alpine/k8s:1.36.2
              command:
                - /bin/sh
                - /scripts/sync.sh
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: public-ip-sync-scripts
