apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword
  namespace: flux-system
spec:
  interval: 1m
  releaseName: onepassword
  targetNamespace: onepassword
  storageNamespace: onepassword
  install:
    crds: CreateReplace
    remediation:
      retries: 3
    timeout: 30m
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 30m
  chart:
    spec:
      chart: connect
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: onepassword
  values:
    connect:
      create: true
      serviceType: ClusterIP
      replicas: 1
      credentials: ""
      credentialsName: op-credentials
      api:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
      sync:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
    operator:
      create: true
      pollingInterval: 600
      token:
        name: onepassword-token
        value: ""
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
