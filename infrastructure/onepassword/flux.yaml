apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-onepassword
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 30m
  path: ./infrastructure/onepassword
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
