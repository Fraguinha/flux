apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-payments
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-reconciler
  namespace: payments
subjects:
  - kind: ServiceAccount
    name: helm-payments
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: app-helm-reconciler
