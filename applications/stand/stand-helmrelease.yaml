apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stand
  namespace: flux-system
spec:
  interval: 1m
  releaseName: stand
  targetNamespace: stand
  storageNamespace: stand
  install:
    remediation:
      retries: 3
    timeout: 30m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 30m
  chart:
    spec:
      chart: ./chart
      sourceRef:
        kind: GitRepository
        name: stand-git
      reconcileStrategy: Revision
  values:
    ingress:
      externalDnsTarget: ${PUBLIC_IPS}
