apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stand-secrets
  namespace: stand
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: stand-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE
      remoteRef:
        key: applications/stand
        property: DATABASE
    - secretKey: SECRET
      remoteRef:
        key: applications/stand
        property: SECRET
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: applications/stand
        property: S3_ENDPOINT
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: applications/stand
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: applications/stand
        property: S3_SECRET_KEY
    - secretKey: S3_BUCKET
      remoteRef:
        key: applications/stand
        property: S3_BUCKET
    - secretKey: S3_REGION
      remoteRef:
        key: applications/stand
        property: S3_REGION
