apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-llm
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 30m
  path: ./applications/llm
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-kyverno-config
    - name: infra-local-path
