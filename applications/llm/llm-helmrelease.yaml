apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llm
  namespace: flux-system
spec:
  interval: 10m
  releaseName: llm
  targetNamespace: llm
  storageNamespace: llm
  serviceAccountName: helm-llm
  install:
    remediation:
      retries: 3
    timeout: 30m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 30m
  chart:
    spec:
      chart: ./applications/llm/chart
      sourceRef:
        kind: GitRepository
        name: flux-system
      reconcileStrategy: ChartVersion
  values:
    nodeSelector:
      kubernetes.io/hostname: carolion
