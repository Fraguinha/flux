apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-ollama-bootstrap
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: llm
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  bootstrap.sh: |
    set -euo pipefail

    mode=${1:-}
    case "$mode" in
      serve | prefetch) ;;
      *)
        echo "usage: bootstrap.sh serve|prefetch" >&2
        exit 2
        ;;
    esac

    : "${OLLAMA_MODELS:?OLLAMA_MODELS must be set}"
    source_model={{ .Values.model.source | quote }}
    alias_model={{ printf "%s:latest" .Values.model.alias | quote }}
    manifest_digest={{ .Values.model.manifestDigest | quote }}
    layer_digest={{ .Values.model.layerDigest | quote }}

    /bin/ollama serve &
    server_pid=$!
    task_pid=
    cleanup() {
      if [ -n "$task_pid" ]; then
        kill "$task_pid" 2>/dev/null || :
        wait "$task_pid" 2>/dev/null || :
      fi
      kill "$server_pid" 2>/dev/null || :
      wait "$server_pid" 2>/dev/null || :
    }
    trap cleanup EXIT
    trap 'exit 143' TERM
    trap 'exit 130' INT

    api() {
      local body=${3:-}
      exec 3<>/dev/tcp/127.0.0.1/11434
      printf '%s %s HTTP/1.0\r\nHost: 127.0.0.1\r\nContent-Type: application/json\r\nContent-Length: %d\r\n\r\n%s' \
        "$1" "$2" "${#body}" "$body" >&3
      cat <&3
      exec 3<&-
    }

    model_field() {
      awk -v name="$2" -v field="$3" '
        BEGIN { RS = "\"name\":\"" }
        NR > 1 && index($0, name "\"") == 1 && match($0, "\"" field "\":\"?[^\",}]*") {
          value = substr($0, RSTART + length(field) + 3, RLENGTH - length(field) - 3)
          sub(/^"/, "", value)
          print value
          exit
        }
      ' <<<"$1"
    }

    run_task() {
      "$@" &
      task_pid=$!
      wait "$task_pid"
      task_pid=
    }

    alias_pinned() {
      [ "$(model_field "$(api GET /api/tags)" "$alias_model" digest)" = "$manifest_digest" ] &&
        /bin/ollama show --modelfile "$alias_model" |
        grep -Fx "FROM $OLLAMA_MODELS/blobs/sha256-$layer_digest" >/dev/null
    }

    until /bin/ollama list >/dev/null 2>&1; do
      if ! kill -0 "$server_pid" 2>/dev/null; then
        wait "$server_pid" || :
        exit 1
      fi
      sleep 1
    done

    if ! alias_pinned; then
      if [ "$(model_field "$(api GET /api/tags)" "$source_model" digest)" != "$manifest_digest" ]; then
        run_task /bin/ollama pull "$source_model"
        pulled_digest=$(model_field "$(api GET /api/tags)" "$source_model" digest)
        if [ "$pulled_digest" != "$manifest_digest" ]; then
          echo "$source_model manifest ${pulled_digest:-missing} does not match pinned $manifest_digest" >&2
          exit 1
        fi
      fi
      /bin/ollama cp "$source_model" "$alias_model"
      if ! alias_pinned; then
        echo "$alias_model does not resolve to manifest $manifest_digest with model layer $layer_digest" >&2
        exit 1
      fi
    fi
    echo "$alias_model pinned to manifest $manifest_digest"

    if [ "$mode" = prefetch ]; then
      exit 0
    fi

    run_task api POST /api/generate "{\"model\":\"$alias_model\",\"keep_alive\":-1,\"stream\":false}" >/tmp/llm-warm
    if ! grep -F '"done":true' /tmp/llm-warm >/dev/null; then
      cat /tmp/llm-warm >&2
      exit 1
    fi
    loaded=$(api GET /api/ps)
    size=$(model_field "$loaded" "$alias_model" size)
    size_vram=$(model_field "$loaded" "$alias_model" size_vram)
    echo "$alias_model loaded: size=${size:-missing} size_vram=${size_vram:-missing}"
    case "$size_vram" in
      '' | 0 | *[!0-9]*)
        echo "$alias_model loaded without GPU offload" >&2
        exit 1
        ;;
    esac
    : >/tmp/llm-ready

    wait "$server_pid"
