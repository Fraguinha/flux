apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-ollama-bootstrap
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: llm
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  download.sh: |
    set -eu
    : "${MODEL_URL:?}" "${MODEL_SHA256:?}"
    blob="/root/.ollama/models/blobs/sha256-$MODEL_SHA256"
    dir=/root/.ollama/import
    file="$dir/$MODEL_SHA256.gguf"
    if [ -e "$blob" ]; then
      echo "model blob $MODEL_SHA256 already present"
      exit 0
    fi
    mkdir -p "$dir"
    if [ -f "$file" ] && echo "$MODEL_SHA256  $file" | sha256sum -c -s; then
      echo "model file $MODEL_SHA256 already downloaded"
      exit 0
    fi
    rm -f "$file"
    curl -fL --retry 10 --retry-all-errors --retry-delay 5 -C - -o "$file.partial" "$MODEL_URL"
    if ! echo "$MODEL_SHA256  $file.partial" | sha256sum -c -s; then
      rm -f "$file.partial"
      echo "downloaded model does not match sha256 $MODEL_SHA256" >&2
      exit 1
    fi
    mv "$file.partial" "$file"
    echo "model file $MODEL_SHA256 downloaded and verified"
  bootstrap.sh: |
    set -euo pipefail

    : "${OLLAMA_MODELS:?OLLAMA_MODELS must be set}"
    alias_model={{ printf "%s:latest" .Values.model.alias | quote }}
    model_sha256={{ .Values.model.sha256 | quote }}
    model_blob="$OLLAMA_MODELS/blobs/sha256-$model_sha256"
    model_import="/root/.ollama/import/$model_sha256.gguf"
    directives=(
      'TEMPLATE {{ "{{ .Prompt }}" }}'
      {{ printf "RENDERER %s" .Values.model.renderer | squote }}
      {{ printf "PARSER %s" .Values.model.parser | squote }}
      {{- range $name, $value := .Values.model.parameters }}
      {{ printf "PARAMETER %s %v" $name $value | squote }}
      {{- end }}
    )

    /bin/ollama serve &
    server_pid=$!
    task_pid=
    cleanup() {
      if [ -n "$task_pid" ]; then
        kill "$task_pid" 2>/dev/null || :
        wait "$task_pid" 2>/dev/null || :
      fi
      kill "$server_pid" 2>/dev/null || :
      wait "$server_pid" 2>/dev/null || :
    }
    trap cleanup EXIT
    trap 'exit 143' TERM
    trap 'exit 130' INT

    api() {
      local body=${3:-}
      exec 3<>/dev/tcp/127.0.0.1/11434
      printf '%s %s HTTP/1.0\r\nHost: 127.0.0.1\r\nContent-Type: application/json\r\nContent-Length: %d\r\n\r\n%s' \
        "$1" "$2" "${#body}" "$body" >&3
      cat <&3
      exec 3<&-
    }

    model_field() {
      awk -v name="$2" -v field="$3" '
        BEGIN { RS = "\"name\":\"" }
        NR > 1 && index($0, name "\"") == 1 && match($0, "\"" field "\":\"?[^\",}]*") {
          value = substr($0, RSTART + length(field) + 3, RLENGTH - length(field) - 3)
          sub(/^"/, "", value)
          print value
          exit
        }
      ' <<<"$1"
    }

    run_task() {
      "$@" &
      task_pid=$!
      wait "$task_pid"
      task_pid=
    }

    alias_pinned() {
      local current line
      current=$(/bin/ollama show --modelfile "$alias_model" 2>/dev/null) || return 1
      [ "$(grep '^FROM ' <<<"$current")" = "FROM $model_blob" ] || return 1
      for line in "${directives[@]}"; do
        grep -Fxq "$line" <<<"$current" || return 1
      done
    }

    until /bin/ollama list >/dev/null 2>&1; do
      if ! kill -0 "$server_pid" 2>/dev/null; then
        wait "$server_pid" || :
        exit 1
      fi
      sleep 1
    done

    if ! alias_pinned; then
      if [ -f "$model_import" ]; then
        model_source=$model_import
      elif [ -f "$model_blob" ]; then
        model_source=$model_blob
      else
        echo "model file $model_sha256 is missing" >&2
        exit 1
      fi
      { printf 'FROM %s\n' "$model_source"; printf '%s\n' "${directives[@]}"; } >/tmp/llm-modelfile
      run_task /bin/ollama create "$alias_model" -f /tmp/llm-modelfile
      if ! alias_pinned; then
        echo "$alias_model does not resolve to model $model_sha256 with the configured settings" >&2
        exit 1
      fi
    fi
    rm -f "$model_import"
    echo "$alias_model pinned to model $model_sha256"

    run_task api POST /api/generate "{\"model\":\"$alias_model\",\"keep_alive\":-1,\"stream\":false}" >/tmp/llm-warm
    if ! grep -F '"done":true' /tmp/llm-warm >/dev/null; then
      cat /tmp/llm-warm >&2
      exit 1
    fi
    loaded=$(api GET /api/ps)
    size=$(model_field "$loaded" "$alias_model" size)
    size_vram=$(model_field "$loaded" "$alias_model" size_vram)
    echo "$alias_model loaded: size=${size:-missing} size_vram=${size_vram:-missing}"
    case "$size_vram" in
      '' | 0 | *[!0-9]*)
        echo "$alias_model loaded without GPU offload" >&2
        exit 1
        ;;
    esac
    : >/tmp/llm-ready

    wait "$server_pid"
