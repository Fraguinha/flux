apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shell
  namespace: flux-system
spec:
  interval: 1m
  releaseName: shell
  targetNamespace: shell
  storageNamespace: shell
  install:
    remediation:
      retries: 3
    timeout: 30m
  upgrade:
    force: true
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 30m
  chart:
    spec:
      chart: ./chart
      sourceRef:
        kind: GitRepository
        name: shell-git
      reconcileStrategy: Revision
  values:
    ingress:
      externalDnsTarget: ${PUBLIC_IPS}
