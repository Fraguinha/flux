apiVersion: v1
kind: ServiceAccount
metadata:
  name: shell-admin
  namespace: shell
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shell-admin
subjects:
  - kind: ServiceAccount
    name: shell-admin
    namespace: shell
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
