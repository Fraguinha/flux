apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: a50passos-secrets
  namespace: a50passos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: a50passos-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE
      remoteRef:
        key: applications/a50passos
        property: DATABASE
    - secretKey: SESSION_SECRET
      remoteRef:
        key: applications/a50passos
        property: SESSION_SECRET
