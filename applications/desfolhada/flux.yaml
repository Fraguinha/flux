apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-desfolhada
  namespace: flux-system
spec:
  interval: 1m
  timeout: 30m
  path: ./applications/desfolhada
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: desfolhada
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-cert-manager
    - name: infra-cert-manager-config
    - name: infra-external-dns
    - name: infra-kyverno-config
    - name: infra-traefik
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: external-dns-targets
        optional: true
