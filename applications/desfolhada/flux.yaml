apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-desfolhada
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 30m
  path: ./applications/desfolhada
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-cert-manager-config
    - name: infra-kyverno-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: external-dns-targets
        optional: true
