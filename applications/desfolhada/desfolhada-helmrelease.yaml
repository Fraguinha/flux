apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: desfolhada
  namespace: flux-system
spec:
  interval: 1m
  releaseName: desfolhada
  targetNamespace: desfolhada
  storageNamespace: desfolhada
  serviceAccountName: helm-desfolhada
  install:
    remediation:
      retries: 3
    timeout: 30m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 30m
  chart:
    spec:
      chart: ./applications/desfolhada/chart
      sourceRef:
        kind: GitRepository
        name: flux-system
      reconcileStrategy: Revision
  values:
    ingress:
      externalDnsTarget: ${PUBLIC_IPS}
