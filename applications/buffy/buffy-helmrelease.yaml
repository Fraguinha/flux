apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: buffy
  namespace: flux-system
spec:
  interval: 1m
  releaseName: buffy
  targetNamespace: buffy
  storageNamespace: buffy
  install:
    remediation:
      retries: 3
    timeout: 30m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 30m
  chart:
    spec:
      chart: jellyfin
      sourceRef:
        kind: HelmRepository
        name: jellyfin
      reconcileStrategy: ChartVersion
  values:
    ingress:
      externalDnsTarget: ${PUBLIC_IPS}
